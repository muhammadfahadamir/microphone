<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speech Transcription & Summarization</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  #status { font-weight: bold; margin-bottom: 10px; }
  button { padding: 10px 20px; font-size: 16px; margin-right: 10px; }
  #transcript, #summary { border: 1px solid #ccc; padding: 12px; margin-top: 10px; min-height: 60px; white-space: pre-wrap; }
  .dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .recording { background: red; }
  .idle { background: gray; }
</style>
</head>
<body>
  <h2>Live Speech Transcription & Summary</h2>
  <div id="status"><span class="dot idle" id="dot"></span><span id="statusText">Requesting microphone permission...</span></div>
  <button id="startBtn" disabled>Start Session</button>
  <button id="endBtn" disabled>End Session</button>

  <h3>Transcript</h3>
  <div id="transcript"></div>

  <h3>Summary</h3>
  <div id="summary"></div>

<script>
const WS_URL = "ws://localhost:8000/ws";
const CHUNK_MS = 8000; // restart the recorder every 8s so each chunk is a complete, decodable file

let ws = null;
let mediaStream = null;
let mediaRecorder = null;
let chunkTimer = null;
let recording = false;
let pendingEnd = false;

const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const startBtn = document.getElementById("startBtn");
const endBtn = document.getElementById("endBtn");
const transcriptDiv = document.getElementById("transcript");
const summaryDiv = document.getElementById("summary");

async function requestMic() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    statusText.textContent = "Microphone ready. Click Start.";
    startBtn.disabled = false;
  } catch (err) {
    statusText.textContent = "Microphone permission denied. Enable it in browser settings and reload.";
  }
}

function connectWs() {
  ws = new WebSocket(WS_URL);
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "partial") {
      transcriptDiv.textContent += (transcriptDiv.textContent ? " " : "") + data.text;
    } else if (data.type === "final") {
      transcriptDiv.textContent = data.transcript;
      summaryDiv.textContent = data.summary;
      statusText.textContent = "Done.";
    } else if (data.type === "error") {
      console.error("Server error:", data.message);
    }
  };
  ws.onclose = () => {
    if (recording) {
      statusText.textContent = "Connection lost, reconnecting...";
      setTimeout(connectWs, 1000);
    }
  };
}

function recordOneChunk() {
  if (!recording) return;
  const recorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm;codecs=opus" });
  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: "audio/webm" });
    if (ws && ws.readyState === WebSocket.OPEN) {
      const buffer = await blob.arrayBuffer();
      ws.send(buffer);
    }
    if (recording) {
      recordOneChunk(); // start the next chunk immediately, no gap
    } else if (pendingEnd) {
      // Session was ended: this was the final chunk. Only now tell the
      // server the session is over, so it isn't missing the last words.
      pendingEnd = false;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "end_session" }));
      }
    }
  };
  mediaRecorder = recorder;
  recorder.start();
  chunkTimer = setTimeout(() => recorder.stop(), CHUNK_MS);
}

startBtn.onclick = () => {
  transcriptDiv.textContent = "";
  summaryDiv.textContent = "";
  recording = true;
  dot.className = "dot recording";
  statusText.textContent = "Recording...";
  startBtn.disabled = true;
  endBtn.disabled = false;
  connectWs();
  ws.onopen = () => recordOneChunk();
};

endBtn.onclick = () => {
  recording = false;
  pendingEnd = true;
  dot.className = "dot idle";
  statusText.textContent = "Processing final summary... (may take up to a minute)";
  startBtn.disabled = false;
  endBtn.disabled = true;
  clearTimeout(chunkTimer);
  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop(); // triggers onstop above, which sends the last
                          // chunk and THEN sends end_session
  } else if (ws && ws.readyState === WebSocket.OPEN) {
    // No active recorder (shouldn't normally happen) — end immediately
    pendingEnd = false;
    ws.send(JSON.stringify({ type: "end_session" }));
  }
};

requestMic();
</script>
</body>
</html>
